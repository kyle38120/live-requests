<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#15131F">
<link rel="icon" href="/images/icon.png">
<title>Live tonight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap" rel="stylesheet">
<script src="/firebase-config.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --house:#15131F;--surface:#1E1B2B;--raised:#29253A;--line:#383250;
  --text:#F3EEE4;--muted:#A9A2BC;--spot:#FFF1D6;--gel:#FF6F96;
}
html,body{background:var(--house);color:var(--text);font-family:'Bricolage Grotesque',system-ui,sans-serif;font-variation-settings:"opsz" 14;min-height:100vh;min-height:100dvh;overscroll-behavior:none}
:focus-visible{outline:2px solid var(--spot);outline-offset:3px}
[hidden]{display:none!important}

/* The spotlight: one warm cone of light falling on the act name. */
.stage{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 28px) 24px calc(env(safe-area-inset-bottom) + 28px);max-width:460px;margin:0 auto;overflow:hidden}
.beam{position:absolute;left:50%;top:-12%;width:150%;height:78%;transform:translateX(-50%);pointer-events:none;
  background:conic-gradient(from 0deg at 50% 0%,transparent 158deg,rgba(255,232,190,.16) 170deg,rgba(255,238,205,.30) 180deg,rgba(255,232,190,.16) 190deg,transparent 202deg);filter:blur(6px);
  -webkit-mask-image:linear-gradient(to bottom,#000 30%,transparent 100%);mask-image:linear-gradient(to bottom,#000 30%,transparent 100%);
  animation:lightsUp 1.4s ease-out both}
.pool{position:absolute;left:50%;top:44%;width:120%;height:22%;transform:translate(-50%,-50%);pointer-events:none;background:radial-gradient(closest-side,rgba(255,226,170,.22),transparent);animation:lightsUp 1.4s ease-out both}
@keyframes lightsUp{from{opacity:0}to{opacity:1}}

.who{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:40px 0 24px}
.live{display:inline-flex;align-items:center;gap:8px;align-self:center;color:var(--muted);font-size:15px;margin-bottom:14px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--gel);box-shadow:0 0 0 0 rgba(255,111,150,.6);animation:beat 2s ease-in-out infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(255,111,150,.55)}70%{box-shadow:0 0 0 10px rgba(255,111,150,0)}100%{box-shadow:0 0 0 0 rgba(255,111,150,0)}}
.act{font-size:clamp(48px,15vw,76px);font-weight:800;font-variation-settings:"opsz" 96,"wdth" 75;line-height:.9;letter-spacing:-.015em;color:var(--spot);text-wrap:balance;overflow-wrap:anywhere}
.venue{color:var(--muted);font-size:18px;margin-top:12px}

.actions{position:relative;display:flex;flex-direction:column;gap:12px}
.btn{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;border-radius:20px;padding:20px 22px;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn .l{font-size:22px;font-weight:700;font-variation-settings:"opsz" 32,"wdth" 85;line-height:1.1}
.btn .s{font-size:15px;opacity:.75;margin-top:2px}
.btn svg{flex-shrink:0}
.btn-spot{background:var(--spot);color:var(--house)}
.btn-ghost{background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}

.foot{position:relative;text-align:center;color:var(--muted);font-size:13px;margin-top:22px;opacity:.7}

@media (prefers-reduced-motion:reduce){.beam,.pool,.live i{animation:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="beam" aria-hidden="true"></div>
  <div class="pool" aria-hidden="true"></div>

  <div class="who">
    <div class="live"><i></i>Live tonight</div>
    <h1 class="act" id="act">Live music</h1>
    <div class="venue" id="venue" hidden></div>
  </div>

  <nav class="actions">
    <a class="btn btn-spot" href="/request">
      <span><span class="l" style="display:block">Request a song</span><span class="s" style="display:block">See the set list and send one in</span></span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
    </a>
    <a class="btn btn-ghost" id="tip" href="#" target="_blank" rel="noopener" hidden>
      <span><span class="l" style="display:block" id="tip-label">Leave a tip</span><span class="s" style="display:block">Thanks for supporting live music</span></span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>
    </a>
  </nav>

  <div class="foot" id="foot"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
const $ = id => document.getElementById(id);
$('foot').textContent = 'Requests by ' + (window.APP_NAME || 'Live Requests');

function tipLabel(url){
  if (/venmo/i.test(url)) return 'Tip with Venmo';
  if (/cash\.app|cashapp/i.test(url)) return 'Tip with Cash App';
  if (/paypal/i.test(url)) return 'Tip with PayPal';
  return 'Leave a tip';
}

if (window.isFirebaseConfigured()) {
  firebase.initializeApp(window.FIREBASE_CONFIG);
  firebase.database().ref('settings').on('value', s => {
    const st = s.val() || {};
    $('act').textContent = st.actName || 'Live music';
    document.title = st.actName ? `${st.actName}, live tonight` : 'Live tonight';
    $('venue').textContent = st.venue ? `at ${st.venue}` : '';
    $('venue').hidden = !st.venue;
    const tip = $('tip');
    if (st.tipLink) { tip.href = st.tipLink; $('tip-label').textContent = tipLabel(st.tipLink); tip.hidden = false; }
    else tip.hidden = true;
  });
}
</script>
</body>
</html>
