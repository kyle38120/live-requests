<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/images/icon.png">
<title>Live tonight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet">
<script src="/firebase-config.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  color-scheme:dark;
  --bg:#000;
  --label:#fff;
  --label2:rgba(235,235,245,.62);
  --label3:rgba(235,235,245,.32);
  --sep:rgba(255,255,255,.11);
  --fill:rgba(118,118,128,.26);
  --fill2:rgba(118,118,128,.16);
  --accent:#FF375F;
  --warm:#FFC98B;
  --green:#30D158;
  --red:#FF453A;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  /* Liquid glass: a translucent pane that bends the stage light behind it */
  --glass:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.05));
  --glass-blur:blur(30px) saturate(190%);
  --glass-shadow:inset 0 1px 0 rgba(255,255,255,.17),inset 0 0 0 .5px rgba(255,255,255,.1),0 14px 34px rgba(0,0,0,.5);
  --rim:linear-gradient(165deg,rgba(255,255,255,.55),rgba(255,255,255,.1) 28%,rgba(255,255,255,0) 55%,rgba(255,255,255,.16));
}
html{background:var(--bg);overscroll-behavior:none}
body{background:none;color:var(--label);font-family:var(--font);font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;min-height:100vh}
/* Stage light falling into the dark room. Everything glass refracts it. */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(70% 42% at 50% -8%,rgba(255,170,88,.30),transparent 70%),
             radial-gradient(55% 34% at 108% 58%,rgba(255,55,95,.17),transparent 72%),
             radial-gradient(50% 30% at -8% 96%,rgba(110,92,255,.13),transparent 72%)}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid rgba(255,255,255,.85);outline-offset:2px}
[hidden]{display:none!important}
/* Specular rim: light catching the top-left edge of a glass pane */
.btn,.chip,.req,.gate-card,.sheet,.back{position:relative;isolation:isolate}
:is(.btn,.chip,.req,.gate-card,.sheet,.back)::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:var(--rim);pointer-events:none;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

html,body{min-height:100vh;min-height:100dvh}
body::before{display:none}

/* The spotlight: one warm cone of light falling on the act name. */
.stage{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 24px);max-width:460px;margin:0 auto;overflow:hidden}
.beam{position:absolute;left:50%;top:-12%;width:150%;height:78%;transform:translateX(-50%);pointer-events:none;
  background:conic-gradient(from 0deg at 50% 0%,transparent 158deg,rgba(255,200,140,.15) 170deg,rgba(255,214,166,.30) 180deg,rgba(255,200,140,.15) 190deg,transparent 202deg);filter:blur(8px);
  -webkit-mask-image:linear-gradient(to bottom,#000 30%,transparent 100%);mask-image:linear-gradient(to bottom,#000 30%,transparent 100%);
  animation:lightsUp 1.4s ease-out both}
.pool{position:absolute;left:50%;top:44%;width:120%;height:24%;transform:translate(-50%,-50%);pointer-events:none;background:radial-gradient(closest-side,rgba(255,180,110,.24),transparent);animation:lightsUp 1.4s ease-out both}
/* Coloured light under the glass buttons so they have something to bend */
.wash{position:absolute;left:50%;bottom:-8%;width:140%;height:42%;transform:translateX(-50%);pointer-events:none;background:radial-gradient(45% 55% at 30% 60%,rgba(255,55,95,.30),transparent 70%),radial-gradient(45% 55% at 75% 55%,rgba(255,160,80,.22),transparent 70%),radial-gradient(40% 50% at 55% 90%,rgba(110,92,255,.2),transparent 70%);filter:blur(10px);animation:lightsUp 1.8s ease-out both}
@keyframes lightsUp{from{opacity:0}to{opacity:1}}

.who{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:40px 0 24px}
.live{display:inline-flex;align-items:center;gap:8px;align-self:center;color:var(--label);font-size:15px;font-weight:500;margin-bottom:16px;padding:7px 14px 7px 12px;border-radius:999px;background:rgba(255,255,255,.1);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 0 0 .5px rgba(255,255,255,.1)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(255,55,95,.6);animation:beat 2s ease-in-out infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 rgba(255,55,95,.55)}70%{box-shadow:0 0 0 10px rgba(255,55,95,0)}100%{box-shadow:0 0 0 0 rgba(255,55,95,0)}}
.act{font-size:clamp(48px,15vw,76px);font-weight:800;line-height:.95;letter-spacing:-.035em;color:#FFF8EF;text-shadow:0 0 50px rgba(255,190,120,.35);text-wrap:balance;overflow-wrap:anywhere}
.venue{color:var(--label2);font-size:19px;margin-top:12px}

.actions{position:relative;display:flex;flex-direction:column;gap:12px}
.btn{display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;border-radius:30px;padding:20px 22px 20px 24px;color:var(--label);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.btn:active{transform:scale(.97)}
.btn .l{display:block;font-size:21px;font-weight:700;letter-spacing:-.016em;line-height:1.15}
.btn .s{display:block;font-size:15px;opacity:.72;margin-top:2px}
.btn svg{flex-shrink:0}
.btn-spot{background:linear-gradient(180deg,rgba(255,96,130,.9),rgba(255,55,95,.82));color:#fff;-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:0 12px 30px rgba(255,55,95,.3),inset 0 1px 0 rgba(255,255,255,.32)}
.btn-ghost{background:var(--glass);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:var(--glass-shadow)}

.foot{position:relative;text-align:center;color:var(--label2);font-size:13px;margin-top:22px;opacity:.75}

@media (prefers-reduced-motion:reduce){.beam,.pool,.wash,.live i{animation:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="beam" aria-hidden="true"></div>
  <div class="pool" aria-hidden="true"></div>
  <div class="wash" aria-hidden="true"></div>

  <div class="who">
    <div class="live"><i></i>Live tonight</div>
    <h1 class="act" id="act">Live music</h1>
    <div class="venue" id="venue" hidden></div>
  </div>

  <nav class="actions">
    <a class="btn btn-spot" href="/request">
      <span><span class="l" style="display:block">Request a song</span><span class="s" style="display:block">See the set list and send one in</span></span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
    </a>
    <a class="btn btn-ghost" id="tip" href="#" target="_blank" rel="noopener" hidden>
      <span><span class="l" style="display:block" id="tip-label">Leave a tip</span><span class="s" style="display:block">Thanks for supporting live music</span></span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>
    </a>
  </nav>

  <div class="foot" id="foot"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
const $ = id => document.getElementById(id);
$('foot').textContent = 'Requests by ' + (window.APP_NAME || 'Live Requests');

function tipLabel(url){
  if (/venmo/i.test(url)) return 'Tip with Venmo';
  if (/cash\.app|cashapp/i.test(url)) return 'Tip with Cash App';
  if (/paypal/i.test(url)) return 'Tip with PayPal';
  return 'Leave a tip';
}

if (window.isFirebaseConfigured()) {
  firebase.initializeApp(window.FIREBASE_CONFIG);
  firebase.database().ref('settings').on('value', s => {
    const st = s.val() || {};
    $('act').textContent = st.actName || 'Live music';
    document.title = st.actName ? `${st.actName}, live tonight` : 'Live tonight';
    $('venue').textContent = st.venue ? `at ${st.venue}` : '';
    $('venue').hidden = !st.venue;
    const tip = $('tip');
    if (st.tipLink) { tip.href = st.tipLink; $('tip-label').textContent = tipLabel(st.tipLink); tip.hidden = false; }
    else tip.hidden = true;
  });
}
</script>
</body>
</html>
